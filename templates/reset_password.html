<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
    (function() {
        var token = document.querySelector('meta[name="csrf-token"]').content;
        var originalFetch = window.fetch;
        window.fetch = function(url, options) {
            options = options || {};
            var method = (options.method || 'GET').toUpperCase();
            if (method !== 'GET' && method !== 'HEAD') {
                options.headers = options.headers || {};
                if (options.headers instanceof Headers) {
                    options.headers.set('X-CSRFToken', token);
                } else {
                    options.headers['X-CSRFToken'] = token;
                }
            }
            return originalFetch(url, options);
        };
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - IKEN Remote Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body.iken-body { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { max-width: 400px; width: 100%; padding: 40px; }
        .auth-logo { text-align: center; margin-bottom: 26px; }
        .auth-logo img { height: 34px; margin-bottom: 12px; }
        .auth-logo h1 { font-size: 18px; color: var(--iken-navy); font-weight: 800; margin: 0; }
        .form-group { margin-bottom: 20px; }
        .iken-btn.full { width: 100%; }
        .login-link { text-align: center; margin-top: 22px; font-size: 13.5px; color: var(--iken-text-muted); }
        .login-link a { color: var(--iken-navy); font-weight: 700; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body class="iken-body">
    <div class="iken-card auth-card">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='img/iken-mark.png') }}" alt="IKEN">
            <h1>IKEN Remote Lab</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="margin-bottom:18px;">
                    {% for category, message in messages %}
                        <div class="iken-flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="iken-label" for="password">New password</label>
                <input class="iken-input" type="password" id="password" name="password" required placeholder="Enter new password">
                <p class="iken-hint"><i class="fas fa-info-circle"></i> At least 8 characters, with uppercase, lowercase, a number, and a special character.</p>
            </div>
            <div class="form-group">
                <label class="iken-label" for="confirm_password">Confirm new password</label>
                <input class="iken-input" type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm new password">
            </div>
            <button type="submit" class="iken-btn iken-btn-primary full">Reset password</button>
        </form>

        <div class="login-link">
            Back to <a href="{{ url_for('login') }}">sign in</a>
        </div>
    </div>
</body>
</html>
