<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Session expired - IKEN Remote Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #071328;
            color: #cbd5e6;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .expired-container {
            max-width: 500px;
            padding: 40px;
            background: #0b1c3d;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .expired-container img { height: 28px; margin-bottom: 20px; filter: brightness(0) invert(1); }
        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 2em;
            font-weight: 800;
        }
        p {
            font-size: 1.05em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .home-btn {
            padding: 13px 28px;
            background: #f2793a;
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        .home-btn:hover {
            background: #dd6527;
        }
        .warning {
            color: #f2793a;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="expired-container">
        <img src="{{ url_for('static', filename='img/iken-mark.png') }}" alt="IKEN">
        <h1>Session expired</h1>
        <p>This session link has expired or is invalid. Session links are only valid during active booking periods.</p>
        {% if message %}
        <p class="warning">{{ message }}</p>
        {% else %}
        <p class="warning">Redirecting to homepage...</p>
        {% endif %}
        <a href="/" class="home-btn" id="homeBtn">Go to Homepage</a>
    </div>
    <script>
        // Auto-redirect to homepage after 2 seconds
        setTimeout(function() {
            window.location.href = '/';
        }, 2000);
    </script>
</body>
</html>
