<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
    (function() {
        var token = document.querySelector('meta[name="csrf-token"]').content;
        var originalFetch = window.fetch;
        window.fetch = function(url, options) {
            options = options || {};
            var method = (options.method || 'GET').toUpperCase();
            if (method !== 'GET' && method !== 'HEAD') {
                options.headers = options.headers || {};
                if (options.headers instanceof Headers) {
                    options.headers.set('X-CSRFToken', token);
                } else {
                    options.headers['X-CSRFToken'] = token;
                }
            }
            return originalFetch(url, options);
        };
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Experiment - IKEN Remote Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        .form-card { max-width: 600px; margin: 0 auto; padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group textarea.iken-input { min-height: 100px; resize: vertical; }
        .form-actions { display: flex; gap: 12px; margin-top: 26px; }
    </style>
</head>
<body class="iken-body">
    {% set active = 'experiments' %}
    {% include 'admin/_sidebar.html' %}

    <div class="main-content">
        <div class="admin-header">
            <h2><i class="fas fa-edit"></i> Edit experiment</h2>
        </div>

        <div class="admin-section form-card">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="iken-label" for="name">Experiment name</label>
                    <input class="iken-input" type="text" id="name" name="name" value="{{ experiment.name }}" required>
                </div>

                <div class="form-group">
                    <label class="iken-label" for="description">Description</label>
                    <textarea class="iken-input" id="description" name="description" required>{{ experiment.description }}</textarea>
                </div>

                <div class="form-group">
                    <label class="iken-label" for="max_duration">Max duration (minutes)</label>
                    <input class="iken-input" type="number" id="max_duration" name="max_duration" value="{{ experiment.max_duration }}" min="5" max="180" required>
                </div>

                <div class="form-group">
                    <label style="font-weight:600; font-size:13.5px; color:var(--iken-text);">
                        <input type="checkbox" name="active" {% if experiment.active %}checked{% endif %}>
                        Active
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="iken-btn iken-btn-primary"><i class="fas fa-save"></i> Update experiment</button>
                    <a href="{{ url_for('manage_experiments') }}" class="iken-btn iken-btn-outline"><i class="fas fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
